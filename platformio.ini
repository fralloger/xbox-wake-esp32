[platformio]
src_dir = firmware/XboxWake
build_dir = ../../work/xbox-wake-build
libdeps_dir = ../../work/xbox-wake-libdeps
default_envs = esp32s3_ch340

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.3.7
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3_ch340]
board = esp32-s3-devkitc-1
; ESP32-S3 + CH340, flash_id verified 16 MB quad flash on COM6.
; The installed 8 MB PSRAM is not required by this firmware.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
